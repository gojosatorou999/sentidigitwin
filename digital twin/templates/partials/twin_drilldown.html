{# Drill-down drawer (README section 8.2 mock). Populated by JS on cell click. #}
<div class="twin-drawer" id="twin-drawer">
  <button class="twin-drawer-close" id="twin-drawer-close" aria-label="Close">&times;</button>
  <div class="twin-drawer-title">
    <span id="twin-drawer-h3">&mdash;</span>
    <span id="twin-drawer-zone"></span>
    <span class="status-tag" id="twin-drawer-status"></span>
  </div>

  <div class="twin-subscore-row" id="twin-drawer-subscores"></div>

  <div class="twin-explanation" id="twin-drawer-explanation"></div>

  <div>
    <div class="twin-drawer-section-title">Critical assets</div>
    <div id="twin-drawer-assets">&mdash;</div>
  </div>

  <div>
    <div class="twin-drawer-section-title">Approved reports</div>
    <div id="twin-drawer-reports">&mdash;</div>
  </div>

  <div class="twin-actions">
    <button class="twin-action-btn" data-action="declare-emergency">Declare Emergency</button>
    <button class="twin-action-btn" data-action="dispatch-volunteer">Dispatch Volunteers</button>
    <button class="twin-action-btn secondary" data-action="broadcast-alert">Broadcast Alert</button>
  </div>
</div>
