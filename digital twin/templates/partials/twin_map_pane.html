{# One city pane, rendered once per city (README section 8.2/9). #}
<div class="twin-pane" data-city="{{ city.slug }}">
  <div class="twin-pane-header">
    <span class="twin-pane-title">
      {{ city.display_name }}
      <span class="stream-badge" data-stream-badge="{{ city.slug }}">○ connecting</span>
    </span>
    <select class="twin-select" data-zone-select="{{ city.slug }}">
      <option value="__all__">Whole City</option>
      {% for zone in city.zones %}
        {% if zone.zone_type != 'synthetic' %}
          <option value="{{ zone.slug }}">{{ zone.display_name }}</option>
        {% endif %}
      {% endfor %}
    </select>
  </div>

  <div class="twin-map-container" id="twin-map-{{ city.slug }}">
    <button class="twin-toggle-btn twin-layer-toggle-btn" style="position:absolute;top:8px;left:8px;z-index:6"
            data-layer-panel-toggle="{{ city.slug }}">Layers &#9662;</button>
    {% include "partials/twin_legend.html" %}
    <div class="twin-tooltip" data-tooltip="{{ city.slug }}"></div>
    <div class="twin-search">
      <input type="text" class="twin-search-input" placeholder="Search {{ city.display_name }}&hellip;"
             data-search-input="{{ city.slug }}" autocomplete="off">
      <div class="twin-search-results" data-search-results="{{ city.slug }}"></div>
    </div>
  </div>

  <div class="twin-kpi" data-kpi="{{ city.slug }}">
    <div class="twin-kpi-row">Loading&hellip;</div>
  </div>
</div>
