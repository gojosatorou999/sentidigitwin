{# Status legend + layer toggle panel (README section 8.4/8.7). #}
<div class="twin-legend">
  <div class="twin-legend-row"><span class="twin-legend-swatch" style="background:#22c55e"></span>Normal (0-24)</div>
  <div class="twin-legend-row"><span class="twin-legend-swatch" style="background:#eab308"></span>Watch (25-49)</div>
  <div class="twin-legend-row"><span class="twin-legend-swatch" style="background:#f97316"></span>Warning (50-74)</div>
  <div class="twin-legend-row"><span class="twin-legend-swatch" style="background:#ef4444"></span>Critical (75-100)</div>
  <div class="twin-legend-row"><span class="twin-legend-swatch" style="background:transparent;border:1px dashed #facc15"></span>Degraded input</div>
</div>

<div class="twin-layer-panel" data-layer-panel="{{ city.slug }}">
  <label><input type="checkbox" data-layer-toggle="satellite" checked=""> Satellite</label>
  <label><input type="checkbox" data-layer-toggle="radar"> Radar</label>
  <label><input type="checkbox" data-layer-toggle="water-drains"> Water &amp; drains</label>
  <label><input type="checkbox" data-layer-toggle="infrastructure"> Infrastructure</label>
  <label><input type="checkbox" data-layer-toggle="traffic"> Traffic</label>
  <label><input type="checkbox" data-layer-toggle="incidents" checked=""> Incidents</label>
  <label><input type="checkbox" data-layer-toggle="buildings-3d" checked=""> 3D buildings</label>
</div>
