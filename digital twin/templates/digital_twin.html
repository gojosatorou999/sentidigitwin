<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel Digital Twin</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/twin.css') }}">
</head>
<body style="margin:0">
  <div class="twin-root">

    <div class="twin-header">
      <div class="twin-header-group" id="twin-horizon-group">
        <span style="color:var(--twin-text-dim);font-size:12px">HORIZON</span>
        {% for h in horizons %}
          <button class="twin-horizon-btn{% if h == 0 %} active{% endif %}" data-horizon="{{ h }}">
            {{ 'Now' if h == 0 else '+' ~ h ~ 'h' }}
          </button>
        {% endfor %}
      </div>

      <button class="twin-toggle-btn" id="twin-camera-link">&#128279; Link cameras</button>

      <select class="twin-select" id="twin-basemap-select">
        <option value="vector">Basemap: Vector</option>
        <option value="satellite">Basemap: Satellite</option>
        <option value="gibs">Basemap: NASA GIBS</option>
      </select>
      <input type="date" class="twin-select" id="twin-gibs-date" style="display:none" title="GIBS imagery date">

      <div class="twin-health-pill" id="twin-health-pill" title="Source health">
        <span style="font-size:12px;color:var(--twin-text-dim)">Health</span>
      </div>
      <span class="twin-clock" id="twin-clock">--:--:--</span>
    </div>

    <div class="twin-panes">
      {% for city in cities %}
        {% include "partials/twin_map_pane.html" %}
      {% endfor %}
    </div>

    <div class="twin-comparison" id="twin-comparison">
      <span class="twin-comparison-item">Loading comparison&hellip;</span>
    </div>
  </div>

  {% include "partials/twin_drilldown.html" %}

  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="{{ url_for('static', filename='js/twin-layers.js') }}"></script>
  <script src="{{ url_for('static', filename='js/twin-stream.js') }}"></script>
  <script src="{{ url_for('static', filename='js/digital-twin.js') }}"></script>
  <script>
    (function () {
      "use strict";

      const CITIES = {{ cities_json | tojson }};
      const HORIZONS = {{ horizons | tojson }};

      const panes = {};
      let cameraLinked = false;
      let syncing = false;

      CITIES.forEach((city) => {
        const container = document.getElementById("twin-map-" + city.slug);
        const kpiEl = document.querySelector(`[data-kpi="${city.slug}"]`);
        const pane = new TwinPane(city.slug, city, container, kpiEl);
        panes[city.slug] = pane;

        pane.map.onHexClick((props) => openDrawer(city.slug, props));
        pane.map.onHexHover((props, lngLat) => showTooltip(city.slug, props, lngLat));

        pane.map.whenLoaded(() => {
          pane.map.flyToBbox(city.bbox);
          pane.refreshAll();
          pane.startStream(onIncidentEvent);
          wireCameraSync(pane);
        });

        wireZoneSelect(pane);
        wireLayerPanel(pane);
        wireSearchBox(pane);
      });

      // ---- horizon scrubber -----------------------------------------------
      document.querySelectorAll("[data-horizon]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-horizon]").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const horizon = parseInt(btn.dataset.horizon, 10);
          Object.values(panes).forEach((p) => p.setHorizon(horizon));
          refreshComparison();
        });
      });

      // ---- zone dropdowns ---------------------------------------------------
      function wireZoneSelect(pane) {
        const select = document.querySelector(`[data-zone-select="${pane.citySlug}"]`);
        if (!select) return;
        select.addEventListener("change", () => {
          pane.setZone(select.value);
          refreshComparison();
        });
      }

      // ---- address search (Nominatim -- free, no key, keeps C5 intact) ------
      function wireSearchBox(pane) {
        const input = document.querySelector(`[data-search-input="${pane.citySlug}"]`);
        const results = document.querySelector(`[data-search-results="${pane.citySlug}"]`);
        if (!input || !results) return;

        let debounceTimer = null;
        let activeRequestId = 0;

        input.addEventListener("input", () => {
          clearTimeout(debounceTimer);
          const query = input.value.trim();
          if (query.length < 3) {
            results.classList.remove("open");
            results.innerHTML = "";
            return;
          }
          debounceTimer = setTimeout(() => runSearch(query), 400);
        });

        input.addEventListener("blur", () => {
          // Delay so a click on a result registers before the list hides.
          setTimeout(() => results.classList.remove("open"), 150);
        });

        async function runSearch(query) {
          const requestId = ++activeRequestId;
          const [minLon, minLat, maxLon, maxLat] = pane.cityMeta.bbox;
          const params = new URLSearchParams({
            q: query, format: "jsonv2", limit: "5",
            viewbox: `${minLon},${maxLat},${maxLon},${minLat}`, bounded: "0",
          });
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?${params}`, {
              headers: { Accept: "application/json" },
            });
            if (requestId !== activeRequestId) return; // a newer keystroke superseded this one
            const matches = res.ok ? await res.json() : [];
            renderResults(matches);
          } catch (err) {
            if (requestId === activeRequestId) renderResults([]);
          }
        }

        function renderResults(matches) {
          if (!matches.length) {
            results.innerHTML = `<div class="twin-search-result muted">No matches</div>`;
            results.classList.add("open");
            return;
          }
          results.innerHTML = matches.map((m, i) => `
            <div class="twin-search-result" data-idx="${i}">
              ${escapeHtml(m.display_name.split(",")[0])}
              <div class="muted">${escapeHtml(m.display_name)}</div>
            </div>`).join("");
          results.classList.add("open");

          results.querySelectorAll("[data-idx]").forEach((el) => {
            el.addEventListener("mousedown", () => {
              const match = matches[parseInt(el.dataset.idx, 10)];
              pane.map.whenLoaded(() => pane.map.map.flyTo({
                center: [parseFloat(match.lon), parseFloat(match.lat)], zoom: 15, duration: 1000,
              }));
              input.value = match.display_name.split(",")[0];
              results.classList.remove("open");
            });
          });
        }
      }

      function escapeHtml(s) {
        const div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
      }

      // ---- layer toggle panels ----------------------------------------------
      function wireLayerPanel(pane) {
        const toggleBtn = document.querySelector(`[data-layer-panel-toggle="${pane.citySlug}"]`);
        const panel = document.querySelector(`[data-layer-panel="${pane.citySlug}"]`);
        if (toggleBtn && panel) {
          toggleBtn.addEventListener("click", () => panel.classList.toggle("open"));
        }
        if (!panel) return;
        panel.querySelectorAll("[data-layer-toggle]").forEach((input) => {
          input.addEventListener("change", () => {
            const layerId = input.dataset.layerToggle;
            pane.map.setLayerVisible(layerId, input.checked);
            if (layerId === "satellite") toggleSatellite(pane, input.checked);
            if (layerId === "traffic") toggleTraffic(pane, input.checked, input);
          });
        });
      }

      function toggleSatellite(pane, on) {
        const url = on
          ? "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
          : null;
        pane.map.setRasterUrl("satellite", url);
      }

      // Section 4.2: TomTom traffic is optional and keyed -- absent a key,
      // /api/twin/traffic reports unavailable and the checkbox no-ops with
      // a plain explanation rather than silently doing nothing (C5: the
      // core loop never depends on this, but a present key should visibly
      // do something when toggled).
      let _trafficInfoPromise = null;
      function toggleTraffic(pane, on, checkbox) {
        if (!on) {
          pane.map.setRasterUrl("traffic", null);
          return;
        }
        if (!_trafficInfoPromise) _trafficInfoPromise = fetch("/api/twin/traffic").then((r) => r.json());
        _trafficInfoPromise.then((info) => {
          if (!info.available) {
            alert("TomTom traffic layer: no TOMTOM_API_KEY configured (optional, section 4.2/C5).");
            checkbox.checked = false;
            return;
          }
          pane.map.setRasterUrl("traffic", info.tile_url_template);
        });
      }

      // ---- header basemap selector (section 8.2/8.4, Phase 8 GIBS date picker) --
      const basemapSelect = document.getElementById("twin-basemap-select");
      const gibsDateInput = document.getElementById("twin-gibs-date");

      async function applyBasemap(choice, gibsDate) {
        const isSatellite = choice === "satellite";
        const isGibs = choice === "gibs";
        gibsDateInput.style.display = isGibs ? "" : "none";

        Object.values(panes).forEach((pane) => {
          pane.map.setRasterUrl("satellite", null);
          pane.map.setRasterUrl("gibs", null);
          const cb = document.querySelector(
            `[data-layer-panel="${pane.citySlug}"] [data-layer-toggle="satellite"]`);
          if (cb) cb.checked = isSatellite;
        });

        if (isSatellite) {
          Object.values(panes).forEach((pane) => toggleSatellite(pane, true));
          return;
        }
        if (!isGibs) return;

        try {
          const params = new URLSearchParams();
          if (gibsDate) params.set("date", gibsDate);
          const res = await fetch(`/api/twin/gibs?${params}`);
          const info = await res.json();
          if (!info.available) {
            alert("NASA GIBS imagery is not available right now (network or capabilities issue).");
            basemapSelect.value = "vector";
            return;
          }
          if (info.fell_back && gibsDate) {
            gibsDateInput.value = info.resolved_date;
          }
          Object.values(panes).forEach((pane) =>
            pane.map.setRasterUrl("gibs", info.tile_url_template, info.max_zoom));
        } catch (err) {
          alert("Could not load NASA GIBS imagery: " + err);
          basemapSelect.value = "vector";
        }
      }

      basemapSelect.addEventListener("change", () => applyBasemap(basemapSelect.value, gibsDateInput.value));
      gibsDateInput.addEventListener("change", () => {
        if (basemapSelect.value === "gibs") applyBasemap("gibs", gibsDateInput.value);
      });

      // ---- camera link toggle -------------------------------------------------
      const cameraLinkBtn = document.getElementById("twin-camera-link");
      cameraLinkBtn.addEventListener("click", () => {
        cameraLinked = !cameraLinked;
        cameraLinkBtn.classList.toggle("on", cameraLinked);
      });

      function wireCameraSync(pane) {
        pane.map.map.on("moveend", () => {
          if (!cameraLinked || syncing) return;
          syncing = true;
          const view = { zoom: pane.map.map.getZoom(), pitch: pane.map.map.getPitch(),
                         bearing: pane.map.map.getBearing() };
          Object.values(panes).forEach((other) => {
            if (other === pane) return;
            other.map.map.jumpTo(view);
          });
          syncing = false;
        });
      }

      // ---- comparison strip ---------------------------------------------------
      async function refreshComparison() {
        const activeHorizonBtn = document.querySelector("[data-horizon].active");
        const horizon = activeHorizonBtn ? activeHorizonBtn.dataset.horizon : "0";
        try {
          const res = await fetch(`/api/twin/compare?horizon=${horizon}`);
          if (!res.ok) return;
          const data = await res.json();
          const el = document.getElementById("twin-comparison");
          el.innerHTML = Object.entries(data).map(([slug, s]) => `
            <span class="twin-comparison-item">
              <b>${slug}</b> avg <b>${s.avg_risk}</b> &middot;
              critical <b>${(s.cells_by_status || {}).critical || 0}</b> &middot;
              incidents <b>${s.incident_count_24h}</b> &middot;
              assets at risk <b>${s.critical_assets_at_risk || 0}</b>
            </span>`).join("");
        } catch (err) { /* comparison strip is best-effort, never blocks the map */ }
      }
      refreshComparison();
      setInterval(refreshComparison, 60000);

      // ---- health pill --------------------------------------------------------
      async function refreshHealth() {
        try {
          const res = await fetch("/api/twin/health");
          if (!res.ok) return;
          const data = await res.json();
          const pill = document.getElementById("twin-health-pill");
          const dots = Object.entries(data.sources)
            .filter(([, v]) => v.tier === 1)
            .map(([key, v]) => `<span class="twin-health-dot ${v.status === 'ok' ? 'ok' : v.status === 'degraded' || v.status === 'failed' ? 'degraded' : ''}" title="${key}: ${v.status}"></span>`)
            .join("");
          pill.innerHTML = `<span style="font-size:12px;color:var(--twin-text-dim)">Health</span>${dots}`;
        } catch (err) { /* health pill is best-effort */ }
      }
      refreshHealth();
      setInterval(refreshHealth, 30000);

      // ---- clock ----------------------------------------------------------------
      setInterval(() => {
        document.getElementById("twin-clock").textContent = new Date().toLocaleTimeString();
      }, 1000);

      // ---- tooltip ------------------------------------------------------------
      function showTooltip(citySlug, props, lngLat) {
        const el = document.querySelector(`[data-tooltip="${citySlug}"]`);
        if (!el) return;
        if (!props) { el.classList.remove("visible"); return; }
        const degraded = (props.degraded_inputs || []);
        el.innerHTML = `
          <b>${props.status.toUpperCase()}</b> &middot; risk ${Math.round(props.risk_score)}<br>
          Incidents nearby: ${props.incident_count}
          ${degraded.length ? `<div class="degraded-note">Degraded: ${degraded.join(", ")}</div>` : ""}
        `;
        el.classList.add("visible");
      }

      // ---- drill-down drawer -----------------------------------------------
      const drawer = document.getElementById("twin-drawer");
      let drawerCity = null, drawerH3 = null;

      async function openDrawer(citySlug, hexProps) {
        drawerCity = citySlug;
        drawerH3 = hexProps.h3;
        const activeHorizonBtn = document.querySelector("[data-horizon].active");
        const horizon = activeHorizonBtn ? activeHorizonBtn.dataset.horizon : "0";

        document.getElementById("twin-drawer-h3").textContent = `Cell ${hexProps.h3}`;
        document.getElementById("twin-drawer-status").textContent = hexProps.status.toUpperCase();
        document.getElementById("twin-drawer-explanation").textContent = "Loading…";
        drawer.classList.add("open");

        try {
          const res = await fetch(`/api/twin/${citySlug}/cell/${hexProps.h3}?horizon=${horizon}`);
          if (!res.ok) throw new Error("cell fetch failed");
          const data = await res.json();
          renderDrawer(data);
        } catch (err) {
          document.getElementById("twin-drawer-explanation").textContent = "Could not load this cell.";
        }
      }

      function renderDrawer(data) {
        const s = data.state || {};
        document.getElementById("twin-drawer-h3").textContent = `Cell ${data.h3}`;
        document.getElementById("twin-drawer-zone").textContent = data.zone_display_name
          ? " · " + data.zone_display_name : "";
        document.getElementById("twin-drawer-status").textContent =
          `${s.status ? s.status.toUpperCase() : ""} ${Math.round(s.risk_score || 0)}`;

        document.getElementById("twin-drawer-subscores").innerHTML = [
          ["Hydro", s.hydro_score], ["Incident", s.incident_score], ["Terrain", s.terrain_score],
          ["Infra", s.infra_score], ["Env", s.env_score],
        ].map(([label, val]) => `<span>${label} <b>${val == null ? "–" : Math.round(val)}</b></span>`).join("");

        document.getElementById("twin-drawer-explanation").textContent = data.explanation || "";

        document.getElementById("twin-drawer-assets").innerHTML = (data.assets || []).length
          ? data.assets.map((a) => `<span class="twin-asset-chip">${a.name || a.asset_type}</span>`).join("")
          : "None on record";

        document.getElementById("twin-drawer-reports").innerHTML = (data.reports || []).length
          ? data.reports.map((r) => `<span class="twin-report-card">${r.hazard_type || "report"} · ${r.priority}</span>`).join("")
          : "None in the last 72h";
      }

      document.getElementById("twin-drawer-close").addEventListener("click", () => {
        drawer.classList.remove("open");
      });

      document.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", () => runDrawerAction(btn.dataset.action));
      });

      async function runDrawerAction(action) {
        if (!drawerCity || !drawerH3) return;
        const pane = panes[drawerCity];
        const cell = (pane.currentFC.features || []).find((f) => f.properties.h3 === drawerH3);
        if (!cell) return;
        const [lng, lat] = cell.geometry.coordinates[0][0];

        // Section 8.5: prefilled from the cell centroid, posted to the
        // EXISTING coordination endpoints. Those endpoints belong to the
        // host Sentinel AI app and don't exist in this standalone module
        // (see TWIN_INTEGRATION.md) -- so this posts to a small config map
        // that a real deployment fills in, and otherwise reports plainly
        // that the action isn't wired up rather than pretending to succeed.
        const endpoints = window.TWIN_COORDINATION_ENDPOINTS || {};
        const url = endpoints[action];
        if (!url) {
          alert(`"${action}" would POST {lat: ${lat.toFixed(4)}, lng: ${lng.toFixed(4)}} to the host app's `
            + `coordination endpoint. Not wired up in this standalone module -- see TWIN_INTEGRATION.md.`);
          return;
        }
        try {
          const res = await fetch(url, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ latitude: lat, longitude: lng, source: "digital_twin", h3: drawerH3 }),
          });
          alert(res.ok ? "Action submitted." : "Action failed: " + res.status);
        } catch (err) {
          alert("Action failed: " + err);
        }
      }

      // ---- incident SSE toast (Phase 7 A4) ---------------------------------
      function onIncidentEvent(citySlug, evt) {
        const pane = panes[citySlug];
        if (pane) { pane.fetchIncidents(); pane.fetchState(); pane.fetchSummary(); }
      }

      // ---- keyboard shortcuts (section 8.5 '?' key) -------------------------
      document.addEventListener("keydown", (e) => {
        if (e.key === "?") {
          alert("Shortcuts:\n? – this help\nClick a hex – drill-down\nEsc – close drawer");
        }
        if (e.key === "Escape") drawer.classList.remove("open");
      });
    })();
  </script>
</body>
</html>
